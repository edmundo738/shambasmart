<!doctype html>
<html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>CHAMBA Mockup</title>
<style>
body{font-family:Poppins,Arial,sans-serif;background:#f7faf7;margin:0;color:#1f2937}
.container{max-width:1100px;margin:auto;padding:24px}.hero{background:linear-gradient(135deg,#4caf50,#6a1b9a);color:#fff;padding:24px;border-radius:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:16px}.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 8px 25px rgba(0,0,0,.06)}
button{border:0;background:#4caf50;color:#fff;padding:8px 12px;border-radius:8px}
</style></head>
<body><main class='container'><header class='hero'><h1>CHAMBA / ShambaSmart</h1><p>Onde o campo encontra oportunidades.</p></header>
<section class='grid'><article class='card'><h2>Dashboard agrícola</h2><p>🌦️ 28ºC • Alerta de chuva forte</p></article>
<article class='card'><h2>Marketplace</h2><p>Milho 50kg - 18.000 Kz</p><button>Tenho interesse</button></article>
<article class='card'><h2>Transporte / Logística</h2><p>Preço sugerido: 6.700 Kz</p></article>
<article class='card'><h2>Perfil do Camponês</h2><p>Reputação: ⭐4.8</p></article>
<article class='card'><h2>Feed Inteligente</h2><p>Histórias de sucesso e notícias locais.</p></article></section></main></body></html>
